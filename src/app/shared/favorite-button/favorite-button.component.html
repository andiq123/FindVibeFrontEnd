@if (isAbleToAddToFav()) {
<button
  class="btn btn-circle btn-ghost flex items-center justify-center transition-all duration-200"
  [class]="forPlayer() ? 'btn btn-circle btn-lg bg-transparent border-none active:bg-base-200/40 hover:bg-base-200/40 disabled:bg-transparent' : 'btn btn-circle btn-sm bg-base-100 hover:bg-base-200 active:scale-95 border border-base-200'"
  (click)="toggleAddToFavorite()"
  [disabled]="isLoadingFavorite()"
  aria-label="Toggle favorite"
>
  @if(isLoadingFavorite()){
    <span class="loading loading-spinner loading-xs mx-auto"></span>
  }@else{ 
    @if (isFavorited()) {
      <fa-icon [icon]="favoritedHeart" [size]="forPlayer() ? '2x' : 'lg'" class="text-primary transition-colors duration-200" />
    } @else {
      <fa-icon [icon]="unFavoritedHeart" [size]="forPlayer() ? '2x' : 'lg'" class="text-base-content/40 hover:text-primary transition-colors duration-200" />
    } 
  }
</button>
}
