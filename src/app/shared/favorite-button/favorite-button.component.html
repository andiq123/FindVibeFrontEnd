@if (isAbleToAddToFav()) {
<button
  class="flex items-center justify-center transition-all duration-300 pressable-native outline-none select-none"
  [class]="forPlayer() ? 'bg-transparent active:scale-90 transition-transform' : 'tap-target-44 w-11 h-11 rounded-full bg-white/[0.05] border border-white/[0.05] active:bg-white/[0.1]'"
  (click)="toggleAddToFavorite()"
  [disabled]="isLoadingFavorite()"
  aria-label="Toggle favorite"
>
  @if(isLoadingFavorite()){
    <span class="loading loading-spinner loading-xs mx-auto text-primary"></span>
  }@else{ 
    @if (isFavorited()) {
      <fa-icon 
        [icon]="favoritedHeart" 
        [size]="forPlayer() ? '2x' : 'lg'" 
        class="text-accent animate-heart-pop" 
      />
    } @else {
      <fa-icon 
        [icon]="unFavoritedHeart" 
        [size]="forPlayer() ? '2x' : 'lg'" 
        class="text-white/40 active:text-accent transition-colors duration-200" 
      />
    } 
  }
</button>
}
