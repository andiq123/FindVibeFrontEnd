@if (isAbleToAddToFav()) {
<button
  type="button"
  class="flex items-center justify-center transition-all duration-300 pressable-native outline-none select-none touch-manipulation"
  [class]="forPlayer() ? 'bg-transparent active:scale-90 transition-transform min-w-12 min-h-12 w-12 h-12' : 'w-12 h-12 rounded-full bg-base-content/5 border border-base-content/10 active:bg-base-content/10'"
  (pointerdown)="$event.stopPropagation()"
  (click)="onToggle($event)"
  [disabled]="isLoadingFavorite()"
  aria-label="Toggle favorite"
>
  @if (isLoadingFavorite()) {
    <span class="loading loading-spinner loading-xs mx-auto text-primary"></span>
  } @else if (forPlayer()) {
    <fa-icon
      [icon]="isFavorited() ? favoritedHeart : unFavoritedHeart"
      size="2x"
      [class]="isFavorited() ? 'text-primary animate-heart-pop' : 'text-base-content/35 active:text-primary transition-colors duration-200'"
    />
  } @else {
    <fa-icon
      [icon]="isFavorited() ? favoritedHeart : unFavoritedHeart"
      class="text-sm"
      [class.text-primary]="isFavorited()"
      [class.animate-heart-pop]="isFavorited()"
      [class.text-base-content/35]="!isFavorited()"
      [class.active:text-primary]="!isFavorited()"
    />
  }
</button>
}
