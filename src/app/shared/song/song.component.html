@if (loading()) {
  <div class="flex justify-between items-center py-3 w-full skeleton-song px-5">
    <div class="grid grid-flow-col gap-4 items-center w-full justify-start">
      <div
        class="relative w-12 h-12 rounded-lg overflow-hidden shrink-0 skeleton-image bg-base-content/5"
      ></div>

      <div class="min-w-0 flex-1 space-y-2">
        <div class="skeleton-title h-4 w-32 rounded bg-base-content/5"></div>
        <div class="skeleton-artist h-3 w-24 rounded bg-base-content/5"></div>
      </div>
    </div>
  </div>
} @else {
  @if (allowReorder()) {
    <div
      class="song-container group flex items-center gap-4 py-3 sm:py-3.5 transition-all duration-200 relative overflow-hidden px-5 w-full touch-manipulation hover:bg-base-200/50 rounded-xl"
      [class.song-active]="isActive()"
      [class.opacity-50]="isUnavailable()"
      appDragAndDrop
      [id]="song().id"
      (reorderSongs)="emitReorder($any($event))"
    >
      <ng-container *ngTemplateOutlet="default"></ng-container>
    </div>
  } @else {
    <div
      class="song-container group flex items-center gap-4 py-3 sm:py-3.5 transition-all duration-200 relative overflow-hidden px-5 w-full touch-manipulation hover:bg-base-200/50 rounded-xl"
      [class.song-active]="isActive()"
      [class.opacity-50]="isUnavailable()"
    >
      <ng-container *ngTemplateOutlet="default"></ng-container>
    </div>
  }
}

<ng-template #default>
  <div
    class="grid grid-flow-col gap-4 items-center w-full justify-start transition-transform duration-200 cursor-pointer"
    [class.unavailable]="isUnavailable()"
    (click)="playOrPause()"
    (keydown.enter)="playOrPause()"
    (keydown.space)="playOrPause(); $event.preventDefault()"
    tabindex="0"
    role="button"
    [attr.aria-label]="
      song().title +
      ' by ' +
      song().artist +
      (isActive() ? ' - Now playing' : '')
    "
    [attr.aria-disabled]="isUnavailable()"
  >
    <div
      class="relative w-12 h-12 rounded-lg overflow-hidden shadow-sm ring-1 ring-base-content/10 shrink-0 album-art"
      [class.loading]="imageLoading()"
    >
      @if (imageLoading()) {
        <div
          class="absolute inset-0 bg-base-content/5 flex items-center justify-center"
        >
          <div
            class="w-4 h-4 border-2 border-base-content/20 border-t-base-content/60 rounded-full animate-spin"
          ></div>
        </div>
      }

      @if (isError() && isActive()) {
        <div
          class="absolute inset-0 bg-error/20 flex items-center justify-center z-20"
        >
          <fa-icon [icon]="faTriangleExclamation" class="text-error text-lg" />
        </div>
      }

      <div
        class="absolute inset-0 bg-base-300/60 flex items-center justify-center opacity-0 group-hover/song:opacity-100 transition-opacity duration-150 z-10"
      >
        <app-player-button [status]="status()" />
      </div>

      <img
        class="w-full h-full object-cover transition-opacity duration-200"
        [class.opacity-0]="imageLoading()"
        [class.opacity-100]="!imageLoading()"
        [ngSrc]="imageSrc()"
        [alt]="song().title + ' by ' + song().artist + ' album art'"
        width="48"
        height="48"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        (loadstart)="onImageLoadStart()"
        (load)="onImageLoad()"
        (error)="onImageError()"
      />

      @if (imageError()) {
        <div
          class="absolute inset-0 bg-base-content/5 flex items-center justify-center"
        >
          <svg
            class="w-5 h-5 text-base-content/30"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </div>
      }
    </div>

    <div class="min-w-0 flex-1 relative py-1">
      <app-moving-title
        [title]="song().title"
        [isActive]="isActive()"
        classes="font-semibold text-base block"
      />
      <app-moving-title
        [title]="song().artist"
        [isActive]="isActive()"
        classes="text-xs text-base-content/50 block"
      />

      <div
        class="absolute -bottom-3 left-0 right-[-100px] h-[0.5px] bg-base-content/10 group-last/item:hidden"
      ></div>
    </div>
  </div>

  <div class="flex gap-4 items-center relative z-10 pr-1">
    @if (showOfflineIndicator()) {
      @if (isDownloadingOffline()) {
        <div class="relative w-5 h-5 flex items-center justify-center">
          <div
            class="absolute inset-0 border-2 border-primary/20 rounded-full"
          ></div>
          <div
            class="absolute inset-0 border-2 border-primary rounded-full border-t-transparent animate-spin"
          ></div>
          <fa-icon [icon]="faCloudArrowDown" class="text-[10px] text-primary" />
        </div>
      } @else {
        @if (isAvailableOffline()) {
          <div
            class="flex items-center justify-center w-5 h-5 rounded-full bg-primary/10 text-primary anim-fade-in"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-3 h-3"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
        }
      }
    }

    <app-favorite-button [song]="song()" />
  </div>
</ng-template>
