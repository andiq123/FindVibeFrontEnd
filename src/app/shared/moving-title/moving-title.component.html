<div class="marquee-wrapper" #container [class.is-overflowing]="isOverflowing()">
  <div 
    class="marquee-content" 
    #content 
    [class.anim-marquee]="isOverflowing() && isActive()"
    [style.animation-duration]="animationDuration() + 's'"
  >
    <span [class]="classes()">{{ title() }}</span>
    @if (isOverflowing()) {
      <span class="marquee-spacer"></span>
      <span [class]="classes()">{{ title() }}</span>
    }
  </div>
</div>
