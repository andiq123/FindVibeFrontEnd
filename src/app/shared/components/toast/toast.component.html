<div
  class="toast-container fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-[600px] flex flex-col gap-2"
  style="z-index: var(--z-toast)"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item glass-suggestions shadow-ios-md rounded-2xl overflow-hidden anim-slide-in-ios touch-manipulation"
      [class.toast-success]="toast.type === ToastType.SUCCESS"
      [class.toast-error]="toast.type === ToastType.ERROR"
      [class.toast-warning]="toast.type === ToastType.WARNING"
      [class.toast-info]="toast.type === ToastType.INFO"
      role="alert"
      [attr.aria-live]="toast.type === ToastType.ERROR ? 'assertive' : 'polite'"
    >
      <div class="flex items-center gap-3 p-4">
        <!-- Icon -->
        <div class="flex-shrink-0">
          <fa-icon
            [icon]="getIcon(toast.type)"
            class="text-xl"
            [class.text-success]="toast.type === ToastType.SUCCESS"
            [class.text-error]="toast.type === ToastType.ERROR"
            [class.text-warning]="toast.type === ToastType.WARNING"
            [class.text-info]="toast.type === ToastType.INFO"
          />
        </div>

        <!-- Message -->
        <div class="flex-1 min-w-0">
          <p
            class="text-[15px] leading-[20px] -tracking-[0.24px] text-base-content font-medium"
          >
            {{ toast.message }}
          </p>
        </div>

        <!-- Action Button -->
        @if (toast.action) {
          <button
            type="button"
            (click)="handleAction(toast.action, toast.id)"
            class="px-3 py-1.5 text-[14px] font-semibold text-primary active:opacity-70 transition-opacity duration-150 touch-manipulation"
          >
            {{ toast.action.label }}
          </button>
        }

        <!-- Close Button -->
        <button
          type="button"
          (click)="dismiss(toast.id)"
          class="flex-shrink-0 w-8 h-8 flex items-center justify-center text-base-content/40 active:text-base-content active:bg-base-content/[0.04] rounded-full transition-all duration-150 active:scale-95 touch-manipulation"
          aria-label="Dismiss notification"
        >
          <fa-icon [icon]="faTimes" class="text-[14px]" />
        </button>
      </div>
    </div>
  }
</div>
