<nav
  class="flex items-center justify-between gap-2 w-full px-1 sm:px-2 py-5 sm:py-6 box-border"
  role="navigation"
  aria-label="Pagination"
>
  <button
    type="button"
    class="flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl border text-sm transition-all duration-200 shrink-0 active:scale-95 disabled:opacity-30 disabled:pointer-events-none"
    [class.bg-base-content/5]="pagination().hasPrevPage"
    [class.border-base-content/10]="pagination().hasPrevPage"
    [class.text-base-content/80]="pagination().hasPrevPage"
    [class.bg-transparent]="!pagination().hasPrevPage"
    [class.border-transparent]="!pagination().hasPrevPage"
    [disabled]="!pagination().hasPrevPage"
    (click)="onPageChange(pagination().currentPage - 1)"
    aria-label="Previous page"
  >
    <fa-icon [icon]="faChevronLeft" class="text-sm" />
  </button>

  <div
    class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto max-w-[min(100%,18rem)] sm:max-w-none scrollbar-none touch-pan-x px-0.5"
  >
    @for (page of pageNumbers(); track $index) {
      @if (isNumber(page)) {
        <button
          type="button"
          class="min-w-9 sm:min-w-10 h-9 sm:h-10 px-2 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-200 cursor-pointer shrink-0 active:scale-90"
          [class.bg-primary]="page === pagination().currentPage"
          [class.text-primary-content]="page === pagination().currentPage"
          [class.shadow-sm]="page === pagination().currentPage"
          [class.text-base-content/55]="page !== pagination().currentPage"
          [class.hover:bg-base-content/8]="page !== pagination().currentPage"
          [attr.aria-label]="'Page ' + page"
          [attr.aria-current]="
            page === pagination().currentPage ? 'page' : null
          "
          (click)="onPageChange(page)"
        >
          {{ page }}
        </button>
      } @else {
        <span
          class="min-w-6 h-9 sm:h-10 flex items-center justify-center text-base-content/25 text-xs shrink-0"
          aria-hidden="true"
          >{{ page }}</span
        >
      }
    }
  </div>

  <button
    type="button"
    class="flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl border text-sm transition-all duration-200 shrink-0 active:scale-95 disabled:opacity-30 disabled:pointer-events-none"
    [class.bg-base-content/5]="pagination().hasNextPage"
    [class.border-base-content/10]="pagination().hasNextPage"
    [class.text-base-content/80]="pagination().hasNextPage"
    [class.bg-transparent]="!pagination().hasNextPage"
    [class.border-transparent]="!pagination().hasNextPage"
    [disabled]="!pagination().hasNextPage"
    (click)="onPageChange(pagination().currentPage + 1)"
    aria-label="Next page"
  >
    <fa-icon [icon]="faChevronRight" class="text-sm" />
  </button>
</nav>
