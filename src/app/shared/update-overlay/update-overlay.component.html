<div class="update-overlay" [class.loading]="updateLoading()">
  <div class="update-card shadow-2xl">
    <div class="glow-effect"></div>
    
    <div class="content">
      <div class="icon-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      
      <h1>New Vibe Available</h1>
      <p>We've polished the experience for you. Updating in <span>{{ secondsToUpdate() }}</span> seconds...</p>
      
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="(secondsToUpdate() / 3) * 100"></div>
      </div>
      
      <button (click)="reloadNow()" class="reload-btn">
        @if (updateLoading()) {
          <div class="spinner"></div>
        } @else {
          Update Now
        }
      </button>
    </div>
  </div>
</div>
