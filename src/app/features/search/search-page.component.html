@if(!isCheckedServer()){
<div class="w-full flex flex-col justify-center items-center gap-4 h-[60vh]">
  <div class="text-center space-y-3">
    <div class="relative w-24 h-24 mx-auto mb-6">
      <div class="absolute inset-0 bg-primary/20 rounded-full animate-ping"></div>
      <div class="relative bg-base-200 rounded-full w-full h-full flex items-center justify-center ring-1 ring-white/10">
        <fa-icon [icon]="faWaveSquare" class="text-4xl text-primary animate-pulse" />
      </div>
    </div>
    <h1 class="text-2xl font-bold tracking-tight">Vibe Server is awakening...</h1>
    <p class="text-base-content/50 text-base max-w-[280px] mx-auto">This might take a few moments as we spin up the high-fidelity audio engine.</p>
  </div>
</div>
}@else {
<app-page-layout>
  <div class="space-y-6 pb-12">
    <div header>
      <app-search-bar [query]="query()" />
    </div>

    <h1 class="font-bold text-4xl section-headline pt-4">Explore</h1>

    <div class="premium-card min-h-[400px]">
      @if (status() === searchStatus.None) {
          <app-empty-state
            [icon]="faMagnifyingGlass"
            title="Find your next favorite"
            description="Search for vibes, artists, or specific songs across the entire library."
          />
      } @else if (status() === searchStatus.Error) {
          <app-empty-state
            [icon]="faTriangleExclamation"
            title="No results found"
            description="Check the spelling or try different keywords."
            variant="error"
          />
      } @else {
          <app-song-list
            [songs]="songs()"
            [isLoading]="status() === searchStatus.Loading"
            [allowReorder]="false"
            emptyStateTitle="Empty vault"
            emptyStateDescription="Try a different search!"
            (playlistChange)="onChangePlaylist()"
          />
      }
    </div>
  </div>
</app-page-layout>
}
