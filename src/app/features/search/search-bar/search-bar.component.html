<form
  (ngSubmit)="submit()"
  class="flex items-center w-full group relative"
  style="z-index: var(--z-search-suggestions)"
>
  <div class="relative flex-1 group/search">
    <div
      class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none transition-all duration-300 z-10"
      [style.color]="isFocused() ? 'var(--color-base-content)' : 'color-mix(in oklab, var(--color-base-content) 40%, transparent)'"
      [class.opacity-0]="isFocused() && searchTerm().length > 0"
    >
      <fa-icon class="text-[17px]" [icon]="faMagnifyingGlass"></fa-icon>
    </div>

    <input
      #searchInput
      type="search"
      placeholder="Artists, songs, lyrics"
      name="searchTerm"
      class="w-full h-11 text-[17px] leading-[22px] -tracking-[0.41px] text-base-content pr-4 pl-12 rounded-xl border-none outline-none ring-0 transition-all duration-200 ease-out touch-manipulation"
      style="background-color: var(--glass-bg-medium); color: var(--color-base-content);"
      [ngModel]="searchTerm()"
      (input)="onInput($event)"
      (focus)="isFocused.set(true)"
      (blur)="isFocused.set(false)"
      autocomplete="off"
      aria-label="Search for artists, songs, or lyrics"
      [attr.aria-expanded]="suggestions().length > 0 || suggestionsLoading()"
      [attr.aria-controls]="
        suggestions().length > 0 ? 'search-suggestions' : null
      "
      aria-autocomplete="list"
      role="combobox"
    />

    @if (searchTerm().length > 0) {
      <button
        type="button"
        (click)="clearSearch(searchInput)"
        class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center transition-all active:scale-90 rounded-full touch-manipulation"
        aria-label="Clear search"
      >
        <span
          class="w-5 h-5 rounded-full flex items-center justify-center active:bg-base-content/35 transition-all duration-150"
          style="background-color: color-mix(in oklab, var(--color-base-content) 25%, transparent); color: var(--color-base-100);"
        >
          <span class="text-[11px] font-semibold leading-none">✕</span>
        </span>
      </button>
    }
  </div>

  <button
    type="button"
    (click)="cancelSearch()"
    class="text-[17px] leading-[22px] -tracking-[0.41px] font-normal active:opacity-60 transition-all duration-200 overflow-hidden whitespace-nowrap touch-manipulation"
    style="color: var(--color-accent);"
    [class.w-0]="!isFocused() && searchTerm() === ''"
    [class.opacity-0]="!isFocused() && searchTerm() === ''"
    [class.mr-0]="!isFocused() && searchTerm() === ''"
    [class.ml-0]="!isFocused() && searchTerm() === ''"
    [class.w-[54px]]="isFocused() || searchTerm() !== ''"
    [class.ml-3]="isFocused() || searchTerm() !== ''"
    [class.opacity-100]="isFocused() || searchTerm() !== ''"
    aria-label="Cancel search"
  >
    Cancel
  </button>

  @if (
    suggestions().length > 0 ||
    (suggestionsLoading() && searchTerm().length > 0)
  ) {
    <ul
      id="search-suggestions"
      role="listbox"
      class="absolute top-full left-0 w-full mt-3 glass-suggestions rounded-2xl overflow-hidden shadow-2xl origin-top"
      style="z-index: var(--z-search-suggestions)"
      aria-label="Search suggestions"
      [attr.aria-busy]="suggestionsLoading()"
    >
      @if (suggestionsLoading()) {
        <div
          class="w-full h-[140px] flex items-center justify-center"
          role="status"
          aria-live="polite"
        >
          <span
            class="loading loading-spinner loading-md text-accent"
            aria-label="Loading suggestions"
          ></span>
        </div>
      } @else {
        @for (suggestion of suggestions(); track suggestion; let idx = $index) {
          <li role="option" [attr.aria-selected]="false">
            <button
              type="button"
              class="group flex items-center justify-between px-5 py-4 cursor-pointer transition-all duration-150 relative border-b last:border-0 w-full text-left touch-manipulation"
              style="border-color: var(--glass-border-subtle);"
              (click)="searchBySuggestion(suggestion)"
            >
              <div class="flex items-center gap-4 min-w-0 flex-1">
                <fa-icon
                  class="text-[16px]"
                  style="color: color-mix(in oklab, var(--color-base-content) 30%, transparent);"
                  [icon]="faMagnifyingGlass"
                ></fa-icon>
                <span
                  class="text-[17px] leading-[22px] font-normal truncate -tracking-[0.41px]"
                  style="color: var(--color-base-content);"
                  >{{ suggestion | titlecase }}</span
                >
              </div>

              <button
                type="button"
                (click)="fillSuggestion(suggestion, $event)"
                class="w-10 h-10 flex items-center justify-center -mr-2 rounded-full transition-all duration-150 active:scale-95 touch-manipulation"
                style="color: color-mix(in oklab, var(--color-base-content) 40%, transparent);"
                [attr.aria-label]="'Fill search with ' + suggestion"
              >
                <fa-icon
                  [icon]="faArrowUpLeft"
                  class="-rotate-45 text-[14px]"
                />
              </button>
            </button>
          </li>
        }
      }
    </ul>
  }
</form>
