<form (ngSubmit)="submit()" class="flex items-center gap-3 w-full group relative z-50">
  <div class="relative flex-1 group/search">
    <!-- Search Icon -->
    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-base-content/40 pointer-events-none transition-all duration-300 z-10" 
         [class.text-base-content]="isFocused()"
         [class.opacity-0]="isFocused() && searchTerm().length > 0">
      <fa-icon class="text-[15px]" [icon]="faMagnifyingGlass"></fa-icon>
    </div>

    <!-- Input Field -->
    <input
      #searchInput
      type="text"
      placeholder="Artists, songs, lyrics"
      name="searchTerm"
      class="w-full bg-base-200 text-[17px] leading-tight text-base-content placeholder:text-base-content/40 px-4 py-[9px] pl-10 rounded-[10px] border-none outline-none ring-0 transition-all duration-300"
      [class.pl-9]="isFocused()"
      [ngModel]="searchTerm()"
      (input)="onInput($event)"
      (focus)="isFocused.set(true)"
      (blur)="isFocused.set(false)"
      autocomplete="off"
      aria-label="Search"
    />

    <!-- Clear Button (only visible when typing) -->
     @if(searchTerm().length > 0) {
      <button 
        type="button"
        (click)="searchTerm.set(''); onInput($any({target: {value: ''}})); searchInput.focus()"
        class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center transition-all hover:bg-base-content/5 active:scale-95 rounded-full"
        aria-label="Clear search"
      >
        <span class="w-4 h-4 rounded-full bg-base-content/20 text-base-100 flex items-center justify-center hover:bg-base-content/40 transition-colors">
          <span class="text-[10px] font-bold">✕</span>
        </span>
      </button>
     }
  </div>

  <!-- Cancel Button -->
  <button
    type="button"
    (click)="cancelSearch()"
    class="text-primary text-[17px] font-normal hover:opacity-80 active:opacity-50 transition-all duration-300 overflow-hidden whitespace-nowrap"
    [class.w-0]="!isFocused() && searchTerm() === ''"
    [class.opacity-0]="!isFocused() && searchTerm() === ''"
    [class.mr-0]="!isFocused() && searchTerm() === ''"
    [class.w-[54px]]="isFocused() || searchTerm() !== ''"
    [class.opacity-100]="isFocused() || searchTerm() !== ''"
  >
    Cancel
  </button>

  <!-- Suggestions Dropdown -->
  @if(suggestions().length > 0) {
    <ul 
      role="listbox" 
      class="absolute top-full left-0 w-full mt-4 z-50 anim-slide-in bg-base-200/80 backdrop-blur-xl rounded-[14px] overflow-hidden border border-white/5 shadow-2xl origin-top"
      aria-label="Search suggestions"
    >
      @for(suggestion of suggestions(); track suggestion) {
        <li role="option" aria-selected="false">
          <button
            type="button"
            class="group flex items-center justify-between px-4 py-3.5 cursor-pointer active:bg-base-content/10 transition-colors relative border-b border-white/5 last:border-0 w-full text-left"
            (click)="searchBySuggestion(suggestion)"
          >
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
              <fa-icon class="text-base-content/40 text-[14px]" [icon]="faMagnifyingGlass"></fa-icon>
              <span class="text-[17px] text-base-content/90 truncate font-normal">{{ suggestion | titlecase }}</span>
            </div>

            <button 
              type="button"
              (click)="fillSuggestion(suggestion, $event)"
              class="w-8 h-8 flex items-center justify-center -mr-2 text-primary active:scale-90 transition-transform"
              aria-label="Fill search with {{ suggestion }}"
            >
               <fa-icon [icon]="faArrowUpLeft" class="-rotate-45 text-sm" />
            </button>
          </button>
        </li>
      }
    </ul>
  }
</form>
