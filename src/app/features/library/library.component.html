@if (!isLoggedIn()) {
  <app-user-form />
} @else {
  <app-page-content>
    <div class="w-full mb-4">
      <div class="flex flex-col">
        <span
          class="text-[10px] font-bold text-base-content/50 uppercase tracking-[0.18em]"
          >Your Library</span
        >
        <h1
          class="font-bold text-2xl tracking-tight bg-gradient-to-br from-base-content via-base-content/95 to-primary/80 bg-clip-text text-transparent"
        >
          {{ username() ? (username() | titlecase) : "My" }}'s Vault
        </h1>
      </div>
    </div>

    <div class="relative" [class.vault-list--bar]="hasReordered()">
      <div class="premium-card">
        <app-song-list
          [songs]="songs()"
          [isLoading]="loadingSongs()"
          [allowReorder]="true"
          emptyStateTitle="No vibes yet"
          emptyStateDescription="When you add songs to your library, they'll show up here."
          (reorder)="reorderSongs($event)"
          (playlistChange)="onChangePlaylist()"
        />
      </div>
    </div>

    @if (hasReordered()) {
      <div
        class="vault-reorder-bar"
        [class.vault-reorder-bar--above-mini]="aboveMini()"
        role="dialog"
        aria-label="Confirm playlist order"
      >
        <p class="vault-reorder-bar__label">Keep this order?</p>
        <div class="vault-reorder-bar__actions">
          <button
            type="button"
            class="vault-reorder-bar__btn vault-reorder-bar__btn--ghost"
            (click)="cancelReorders()"
            [disabled]="loadingReorder()"
            aria-label="Discard reorder"
          >
            <fa-icon [icon]="faXmark" />
            <span>Discard</span>
          </button>
          <button
            type="button"
            class="vault-reorder-bar__btn vault-reorder-bar__btn--primary"
            (click)="saveReorders()"
            [disabled]="loadingReorder()"
            aria-label="Save reorder"
          >
            @if (loadingReorder()) {
              <span class="loading loading-spinner loading-xs"></span>
              <span>Saving</span>
            } @else {
              <fa-icon [icon]="faCheck" />
              <span>Save</span>
            }
          </button>
        </div>
      </div>
    }
  </app-page-content>
}
