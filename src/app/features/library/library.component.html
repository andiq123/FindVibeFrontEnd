<div
  class="w-full max-w-2xl mx-auto mt-0 px-0 min-h-screen bg-base-100"
  [class.slideLeft]="lastRouterIsRecents()"
  [class.slideRight]="!lastRouterIsRecents()"
>
  @if (!isLoggedIn()) { <app-user-form /> } @else {
    @if(loadingSongs()){
      <div class="flex flex-col items-center justify-center w-full py-24 px-5 text-center">
        <h1 class="text-2xl font-bold tracking-tight mb-2">Opening Vault</h1>
        <p class="text-base-content/60 text-sm mb-8">Gathering your favorite vibes...</p>
        <div class="flex gap-3">
          <span class="loading loading-ball loading-md text-primary"></span>
          <span class="loading loading-ball loading-md text-primary opacity-60"></span>
          <span class="loading loading-ball loading-md text-primary opacity-30"></span>
        </div>
      </div>
    }@else {
      <div class="flex flex-col gap-0">
        <!-- Sticky header/actions - Dynamic z-index to stay on top of library content when modal is open -->
        <div 
          class="sticky top-0 z-20 bg-base-100/80 backdrop-blur-3xl pt-7 pb-5 px-5 border-b border-white/[0.03] transition-all duration-300"
        >
          <div class="flex justify-between items-center gap-4">
            <div class="flex flex-col gap-0.5">
              <span class="text-xs font-bold text-primary uppercase tracking-[0.2em] opacity-80">Your Library</span>
              <h1 class="font-bold text-4xl tracking-tight text-white mb-1">
                {{ username() ? (username() | titlecase) : 'My' }}'s Vault
              </h1>
            </div>
            
            <div class="flex gap-2.5 items-center shrink-0">
              @if(orderHasChanged()) {
                <div class="flex gap-1.5 items-center mr-1">
                  <button class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center shadow-lg active:scale-95 transition-all" (click)="saveReorders()">
                    <fa-icon [icon]="faCheck" />
                  </button>
                  <button class="w-10 h-10 rounded-full bg-white/10 text-white/60 flex items-center justify-center active:scale-95 transition-all" (click)="cancelReorders()">
                    <fa-icon [icon]="faXmark" />
                  </button>
                </div>
              }
              
              <!-- Refined Storage Trigger -->
              <button 
                class="w-10 h-10 rounded-full bg-white/5 border border-white/10 text-white/40 flex items-center justify-center relative active:scale-90 transition-all" 
                (click)="storageMenu.toggle()"
              >
                <fa-icon [icon]="isDownloading() ? faCircleNotch : faArrowDown" [class.animate-spin]="isDownloading()" class="text-sm" />
                @if(showStorageDot()) {
                  <div class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-primary rounded-full border-2 border-base-100 shadow-sm animate-pulse"></div>
                }
              </button>

              <button class="w-10 h-10 rounded-full bg-white/5 border border-white/5 text-white/40 flex items-center justify-center active:scale-95 transition-all" (click)="changeUser()">
                <fa-icon [icon]="faRightFromBracket" />
              </button>
            </div>
          </div>
        </div>
        <div class="h-4"></div>
        <div class="mb-36 relative px-0">
          @if (loadingReorder()) {
            <div class="bg-base-200/80 absolute w-full h-full inset-0 z-10 flex flex-col gap-3 items-center justify-center">
              <span class="text-base font-medium text-base-content/70 mb-2">Applying reorder...</span>
              <span class="loading loading-md text-primary"></span>
            </div>
          }
          <app-songs-wrapper
            [songs]="songs()"
            (onReorderSongs)="reorderSongs($event)"
            (onChangePlaylist)="onChangePlaylist()"
          />
        </div>
      </div>
    }
  }
</div>

<!-- Root-Level Storage Modal: Escaping nested stacking contexts -->
<app-storage-info #storageMenu />
