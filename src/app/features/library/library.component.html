@if (!isLoggedIn()) {
  <app-user-form />
} @else {
  <app-page-content [isServerReady]="isCheckedServer()">
    <div class="flex justify-between items-center gap-4 w-full mb-6">
      <div class="flex flex-col gap-0.5">
        <span
          class="text-xs font-bold text-base-content/50 uppercase tracking-[0.2em]"
          >Your Library</span
        >
        <h1
          class="font-bold text-5xl tracking-tight bg-gradient-to-br from-base-content via-base-content/90 to-base-content/60 bg-clip-text text-transparent mb-2 flex items-center gap-3"
        >
          <span
            >{{ username() ? (username() | titlecase) : "My" }}'s Vault</span
          >
        </h1>
      </div>
      <div class="flex gap-2.5 items-center shrink-0">
        <button
          class="w-11 h-11 rounded-full bg-base-200/40 border border-base-content/10 text-base-content/60 flex items-center justify-center relative active:scale-90 transition-all duration-200 hover:bg-base-200/60 hover:text-base-content/80 hover:border-base-content/20 backdrop-blur-sm shadow-sm"
          (click)="openStorageInfo()"
        >
          <fa-icon
            [icon]="isDownloading() ? faCircleNotch : faArrowDown"
            [class.animate-spin]="isDownloading()"
            class="text-sm"
          />
          @if (showStorageDot()) {
            <div
              class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-primary rounded-full border-2 border-base-100 shadow-sm animate-pulse"
            ></div>
          }
        </button>
        <button
          class="w-11 h-11 rounded-full bg-base-200/40 border border-base-content/10 text-base-content/60 flex items-center justify-center active:scale-90 transition-all duration-200 hover:bg-base-200/60 hover:text-base-content/80 hover:border-base-content/20 backdrop-blur-sm shadow-sm"
          (click)="changeUser()"
        >
          <fa-icon [icon]="faRightFromBracket" />
        </button>
      </div>
    </div>
    <div class="relative pb-12">
        @if (hasReordered()) {
          <div class="flex gap-3 mb-4 sticky top-0 z-20 pb-3">
            <button
              class="flex-1 py-3 px-4 rounded-2xl bg-primary text-primary-content font-bold text-sm transition-all active:scale-95 [@media(hover:hover)]:hover:bg-primary/90 flex items-center justify-center gap-2"
              (click)="saveReorders()"
              [disabled]="loadingReorder()"
              aria-label="Save reorder"
            >
              @if (loadingReorder()) {
                <span class="loading loading-spinner loading-xs"></span>
                <span>Saving</span>
              } @else {
                <fa-icon [icon]="faCheck" />
                <span>Save</span>
              }
            </button>
            <button
              class="flex-1 py-3 px-4 rounded-2xl bg-base-200/60 border border-white/10 text-base-content/70 font-bold text-sm transition-all active:scale-95 [@media(hover:hover)]:hover:bg-base-200 flex items-center justify-center gap-2"
              (click)="cancelReorders()"
              [disabled]="loadingReorder()"
              aria-label="Cancel reorder"
            >
              <fa-icon [icon]="faXmark" />
              <span>Cancel</span>
            </button>
          </div>
        }
        <div class="premium-card min-h-[400px]">
          @if (loadingReorder()) {
            <div
              class="bg-base-200/80 absolute w-full h-full inset-0 z-10 flex flex-col gap-3 items-center justify-center rounded-[2.5rem]"
            >
              <span class="text-base font-medium text-base-content/70 mb-2"
                >Applying changes...</span
              >
              <span class="loading loading-md text-primary"></span>
            </div>
          }
          <app-song-list
            [songs]="songs()"
            [isLoading]="loadingSongs()"
            [allowReorder]="true"
            emptyStateTitle="No vibes yet"
            emptyStateDescription="When you add songs to your library, they'll show up here."
            (reorder)="reorderSongs($event)"
            (playlistChange)="onChangePlaylist()"
          />
        </div>
      </div>
  </app-page-content>
}
