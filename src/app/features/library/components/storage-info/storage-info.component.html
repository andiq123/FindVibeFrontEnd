<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-sm px-8 flex flex-col gap-10 pt-4">
    <div class="text-center space-y-2">
      <h2 class="text-2xl font-bold text-base-content tracking-tight">
        Settings
      </h2>
      <p class="text-sm text-base-content/50">Manage your app preferences</p>
    </div>

    <div
      class="bg-gradient-to-br from-primary/10 to-secondary/5 border border-primary/20 rounded-2xl p-6 space-y-6 backdrop-blur-sm"
    >
      <div class="space-y-4">
        <div class="flex justify-between items-end">
          <span class="text-4xl font-bold text-base-content tracking-tighter"
            >{{ storageUsed() || "..." }}
            <small
              class="text-sm text-primary font-black uppercase tracking-wider ml-1"
              >GB</small
            ></span
          >
          <span
            class="text-xs text-base-content/40 font-bold uppercase tracking-widest"
            >Of {{ storageTotal() || "..." }} GB</span
          >
        </div>

        <div
          class="h-3 w-full bg-base-300/40 rounded-full overflow-hidden backdrop-blur-sm"
        >
          <div
            class="h-full bg-gradient-to-r from-primary to-secondary transition-all duration-1000 ease-out rounded-full shadow-lg shadow-primary/30"
            [style.width.%]="(storageUsed() / (storageTotal() || 1)) * 100"
          ></div>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-primary to-secondary text-white font-bold text-sm flex items-center justify-center gap-2 pressable-native shadow-lg shadow-primary/20 transition-all [@media(hover:hover)]:hover:shadow-primary/30"
        (click)="downloadAll()"
        [disabled]="loadingDownloading()"
      >
        @if (loadingDownloading()) {
          <span class="loading loading-spinner loading-xs"></span>
          <span>Downloading...</span>
        } @else {
          <fa-icon [icon]="faCloudArrowDown" />
          <span>Download All Songs</span>
        }
      </button>

      @if (showRemoveCacheButton()) {
        <button
          class="w-full py-4 rounded-2xl bg-base-200/60 border border-error/30 text-error font-bold text-sm flex items-center justify-center gap-2 pressable-native transition-all [@media(hover:hover)]:hover:bg-error/10"
          (click)="removeCache()"
          [disabled]="loadingClearing()"
        >
          @if (loadingClearing()) {
            <span class="loading loading-spinner loading-xs"></span>
            <span>Clearing Cache...</span>
          } @else {
            <fa-icon [icon]="faTrash" class="text-xs" />
            <span>Clear Offline Cache</span>
          }
        </button>
      }
    </div>

    <button
      class="w-full py-2 text-base-content/40 font-bold text-sm pressable-native transition-colors [@media(hover:hover)]:hover:text-primary"
      (click)="close()"
    >
      Dismiss
    </button>
  </div>
</div>
