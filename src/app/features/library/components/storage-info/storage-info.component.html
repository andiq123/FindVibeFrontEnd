<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-sm px-8 flex flex-col gap-10 pt-4">

    <div class="text-center space-y-1">
      <h2 class="text-2xl font-bold text-white tracking-tight">Vault Storage</h2>
      <p class="text-sm text-white/40">Manage your offline music</p>
    </div>

    <div class="bg-white/[0.03] border border-white/[0.05] rounded-3xl p-6 space-y-6">
      <div class="space-y-3">
        <div class="flex justify-between items-end">
          <span class="text-3xl font-bold text-white tracking-tighter">{{ storageUsed() || '...' }} <small class="text-sm text-white/40 uppercase font-black">GB</small></span>
          <span class="text-xs text-white/30 font-bold uppercase tracking-widest">Of {{ storageTotal() || '...' }} GB used</span>
        </div>

        <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden">
          <div 
            class="h-full bg-primary transition-all duration-1000 ease-out rounded-full"
            [style.width.%]="(storageUsed() / (storageTotal() || 1)) * 100"
          ></div>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button
        class="w-full py-4 rounded-2xl bg-primary text-white font-bold text-sm flex items-center justify-center gap-2 pressable-native shadow-lg"
        (click)="downloadAll()"
        [disabled]="loadingDownloading()"
      >
        @if(loadingDownloading()){
          <span class="loading loading-spinner loading-xs"></span>
          <span>Downloading...</span>
        } @else {
          <fa-icon [icon]="faCloudArrowDown" />
          <span>Download All Songs</span>
        }
      </button>

      @if(showRemoveCacheButton()){
        <button 
          class="w-full py-4 rounded-2xl bg-white/[0.03] border border-white/[0.05] text-error/90 font-bold text-sm flex items-center justify-center gap-2 pressable-native" 
          (click)="removeCache()"
          [disabled]="loadingClearing()"
        >
          @if(loadingClearing()){
            <span class="loading loading-spinner loading-xs"></span>
            <span>Clearing Cache...</span>
          } @else {
            <fa-icon [icon]="faTrash" class="text-xs" />
            <span>Clear Offline Cache</span>
          }
        </button>
      }
    </div>

    <button 
      class="w-full py-2 text-white/40 font-bold text-sm pressable-native hover:text-white"
      (click)="close()"
    >
      Dismiss
    </button>
  </div>
</div>
