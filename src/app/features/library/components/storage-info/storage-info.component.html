<div class="w-full flex flex-col items-center">
  <div class="w-full max-w-sm px-8 flex flex-col gap-8 pt-4">
    <div class="text-center space-y-2">
      <h2 class="text-2xl font-bold text-base-content tracking-tight">
        Offline vault
      </h2>
      <p class="text-sm text-base-content/50">
        Save favorites for fast offline play
      </p>
    </div>

    <div
      class="bg-gradient-to-br from-primary/10 to-secondary/5 border border-primary/20 rounded-2xl p-6 space-y-5"
    >
      <div class="flex justify-between items-end gap-3">
        <div>
          <p
            class="text-[10px] font-bold uppercase tracking-widest text-base-content/40 mb-1"
          >
            Saved offline
          </p>
          <p class="text-3xl font-bold tracking-tight tabular-nums">
            {{ offlineCount() }}
            <span class="text-sm font-semibold text-base-content/45"
              >/ {{ libraryCount() }}</span
            >
          </p>
        </div>
        <div class="text-right">
          <p
            class="text-[10px] font-bold uppercase tracking-widest text-base-content/40 mb-1"
          >
            Device storage
          </p>
          <p class="text-sm font-semibold text-base-content/70 tabular-nums">
            {{ storageUsed() || "…" }} /
            {{ storageTotal() || "…" }} GB
          </p>
        </div>
      </div>
      <div class="h-2 w-full bg-base-300/40 rounded-full overflow-hidden">
        <div
          class="h-full bg-gradient-to-r from-primary to-secondary transition-all duration-500 rounded-full"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button
        type="button"
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-primary to-secondary text-white font-bold text-sm flex items-center justify-center gap-2 pressable-native transition-transform active:scale-[0.98] disabled:opacity-60"
        (click)="downloadAll()"
        [disabled]="loadingDownloading() || libraryCount() === 0"
      >
        @if (loadingDownloading()) {
          <span class="loading loading-spinner loading-xs"></span>
          <span>Saving offline…</span>
        } @else {
          <fa-icon [icon]="faCloudArrowDown" />
          <span>Save all offline</span>
        }
      </button>

      @if (showRemoveCacheButton()) {
        <button
          type="button"
          class="w-full py-4 rounded-2xl bg-base-200/60 border border-error/30 text-error font-bold text-sm flex items-center justify-center gap-2 pressable-native transition-all [@media(hover:hover)]:hover:bg-error/10 disabled:opacity-60"
          (click)="removeCache()"
          [disabled]="loadingClearing()"
        >
          @if (loadingClearing()) {
            <span class="loading loading-spinner loading-xs"></span>
            <span>Clearing…</span>
          } @else {
            <fa-icon [icon]="faTrash" class="text-xs" />
            <span>Clear offline cache</span>
          }
        </button>
      }

      @if (lastResult()) {
        <p class="text-center text-xs text-base-content/50 pt-1">
          {{ lastResult() }}
        </p>
      }
    </div>
  </div>
</div>
