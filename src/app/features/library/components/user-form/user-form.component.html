<div class="flex flex-col items-center justify-center min-h-[60vh] w-full px-4">
  <div class="w-full max-w-xs flex flex-col gap-6">
    <h3 class="text-2xl font-extrabold text-center tracking-tight text-base-content">FindVibe</h3>
    <p class="text-base text-center text-base-content/70">Your library is synced by your name!</p>
    <form
      (ngSubmit)="setUpUser()"
      method="dialog"
      class="flex flex-col gap-4 mt-2"
    >
      <label class="input input-bordered flex items-center gap-2 rounded-full px-4 py-3 bg-base-100 border border-base-200 focus-within:border-primary transition-all">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          fill="currentColor"
          class="h-5 w-5 opacity-60"
        >
          <path
            d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z"
          />
        </svg>
        <input
          name="username"
          type="text"
          class="grow bg-transparent outline-none border-none text-base"
          placeholder="Type your name..."
          [(ngModel)]="name"
          autocomplete="off"
        />
      </label>
      <button
        class="btn btn-primary btn-lg w-full rounded-full text-lg font-semibold mt-2"
        type="submit"
        [disabled]="!name() || loadingSubmiting()"
      >
        Save @if(loadingSubmiting()){
        <span class="loading loading-spinner loading-md"></span>
        }
      </button>
    </form>
  </div>
</div>
