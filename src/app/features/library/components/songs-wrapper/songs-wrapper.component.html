<div class="card-container">
  <ul class="flex flex-col">
    @for (song of songs(); track song.id) {
    <li 
      class="group/item list-none"
    >
      <app-song
        [song]="song"
        [isFavoritePage]="true"
        [allowReorder]="true"
        (reorder)="emitReorder($event)"
        (playlistChange)="emitPlaylistChange()"
      />
    </li>    } @empty {
        <app-empty-state
          [icon]="faMusic"
          title="No vibes yet"
          description="When you add songs to your library, they'll show up here."
        />
    }
  </ul>
</div>
