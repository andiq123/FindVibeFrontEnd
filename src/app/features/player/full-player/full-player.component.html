<div
  class="player-outer fixed inset-0"
  style="z-index: var(--z-full-player)"
  [class.pointer-events-none]="!isOpened() && !isOpeningAnimation() && !isClosingAnimation()"
>
  <button
    type="button"
    class="player-backdrop fixed inset-0 z-0 border-0 p-0 cursor-default transition-opacity duration-200"
    [class.visible]="isOpeningAnimation() || isOpened() || isClosingAnimation()"
    [class.pointer-events-none]="!isOpened() || isClosingAnimation()"
    (click)="toggleSize()"
    (keydown.enter)="toggleSize()"
    (keydown.space)="toggleSize(); $event.preventDefault()"
    aria-label="Close player"
  ></button>
  <div
    class="fixed bottom-0 left-0 right-0 z-10 h-[100dvh] flex flex-col player-container player-desktop"
    [class.anim-slide-up]="isOpeningAnimation() && !isOpened()"
    [class.anim-slide-down]="isClosingAnimation()"
    [class.opened]="isOpened() && !isClosingAnimation()"
    (animationend)="onAnimationEnd($event)"
    appSwipeDown
    [handleSelector]="'.player-content-card, .artwork-wrapper, .pressable-native'"
    [disabled]="isOpeningAnimation()"
    (closePanel)="onSwipeClose()"
  >
  <div
    class="player-content-card flex-1 flex flex-col rounded-t-[2.5rem] overflow-hidden relative pt-safe"
  >
    <div
      class="w-full pt-4 pb-2 flex flex-col items-center justify-center shrink-0 relative z-20"
    >
      <button
        class="group w-full flex flex-col items-center justify-center -mt-2 pressable-native touch-manipulation p-4 min-h-[44px]"
        (click)="toggleSize()"
        aria-label="Minimize player"
        type="button"
      >
        <div
          class="w-12 h-1.5 bg-base-content/30 rounded-full group-active:bg-base-content/50 transition-colors duration-200"
        ></div>
      </button>
    </div>
    <div class="absolute inset-0 -z-20 overflow-hidden bg-base-100">
      <img
        [ngSrc]="song().image || 'no_album_art.jpg'"
        alt="Song Art BG"
        class="absolute inset-0 w-full h-full object-cover select-none pointer-events-none opacity-40 blur-[40px] player-bg-image"
        fill
        sizes="100vw"
        priority
        referrerpolicy="no-referrer"
        draggable="false"
      />
      <div class="absolute inset-0 bg-base-100/50 player-bg-overlay"></div>
    </div>
    <div
      class="flex-1 flex flex-col items-center justify-start px-4 sm:px-6 pb-safe pt-2 max-w-[600px] mx-auto relative z-10 w-full min-h-0"
    >
      <div
        class="w-full flex-1 flex items-center justify-center artwork-container min-h-0 py-2"
      >
        <div
          class="relative w-full aspect-square max-w-[280px] sm:max-w-[340px] group flex items-center justify-center artwork-wrapper"
          [class.playing]="
            status() === playerStatus.Playing && !isOpeningAnimation()
          "
        >
        <div
          class="absolute inset-0 rounded-3xl overflow-hidden bg-base-300 transition-transform duration-300"
          [class.ring-2]="status() === playerStatus.Playing"
          [class.ring-primary/25]="status() === playerStatus.Playing"
        >
            @if (status() === playerStatus.Error) {
              <div
                class="absolute inset-0 bg-error/20 flex items-center justify-center z-30"
              >
                <fa-icon
                  [icon]="faTriangleExclamation"
                  class="text-error text-5xl"
                />
              </div>
            }
            <img
              [ngSrc]="song().image || 'no_album_art.jpg'"
              [alt]="song().title"
              width="340"
              height="340"
              priority
              class="object-cover"
              referrerpolicy="no-referrer"
            />
          </div>
        </div>
      </div>
      <div class="w-full mt-2 mb-6 sm:mb-10 space-y-2 shrink-0">
        <div class="flex items-center justify-between gap-4">
          <div class="flex-1 min-w-0">
            <app-moving-title
              [title]="song().title"
              [isBold]="true"
              fontSize="1.5rem"
              color="var(--color-base-content)"
            />
            <button
              class="text-base-content/60 text-lg truncate mt-1 active:text-base-content/90 transition-colors duration-150 text-left w-full touch-manipulation [@media(hover:hover)]:hover:text-base-content/80"
              (click)="navigateToArtist()"
              [attr.aria-label]="'View songs by ' + song().artist"
              type="button"
            >
              {{ song().artist }}
            </button>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button
              type="button"
              class="w-9 h-9 rounded-full bg-base-content/5 border border-base-content/10 flex items-center justify-center text-base-content/40 active:bg-base-content/10 active:scale-90 transition-all pressable-native outline-none select-none disabled:opacity-50"
              (click)="downloadMp3()"
              [disabled]="isDownloadingMp3()"
              [attr.aria-label]="
                isDownloadingMp3() ? 'Downloading MP3' : 'Download MP3'
              "
            >
              @if (isDownloadingMp3()) {
                <span
                  class="loading loading-spinner loading-xs text-primary"
                ></span>
              } @else {
                <fa-icon [icon]="faArrowDown" class="text-sm" />
              }
            </button>
            <app-favorite-button [song]="song()" />
          </div>
        </div>
        <div class="seek space-y-1.5">
          <div
            class="seek-bar"
            [class.seek-bar--dragging]="isDraggingTime()"
          >
            <div class="seek-track" aria-hidden="true">
              <div
                class="seek-fill"
                [style.width.%]="progressPercent()"
              ></div>
            </div>
            <input
              type="range"
              class="seek-input"
              min="0"
              [max]="duration() || 0"
              step="any"
              [value]="displayTime()"
              (pointerdown)="onTimeDragStart(); $event.stopPropagation()"
              (input)="onTimeChange($event)"
              (pointerup)="onTimeDragEnd($event); $event.stopPropagation()"
              (pointercancel)="onTimeDragEnd($event)"
              (change)="onTimeDragEnd($event)"
              aria-label="Seek"
              role="slider"
              [attr.aria-valuemin]="0"
              [attr.aria-valuemax]="duration()"
              [attr.aria-valuenow]="displayTime()"
              [attr.aria-valuetext]="(displayTime() | timeFormat)"
            />
          </div>
          <div
            class="flex justify-between text-[11px] font-medium text-base-content/45 tabular-nums px-0.5"
          >
            <span>{{ displayTime() | timeFormat }}</span>
            <span>{{ duration() | timeFormat }}</span>
          </div>
        </div>
        <div class="flex items-center justify-between gap-1 pt-1">
          <button
            type="button"
            class="w-11 h-11 rounded-full flex items-center justify-center touch-manipulation text-base-content/40 active:scale-[0.92] active:bg-base-content/8 transition-colors"
            [class.text-primary]="settingsService.isShuffle()"
            [attr.aria-label]="
              settingsService.isShuffle() ? 'Disable shuffle' : 'Enable shuffle'
            "
            [attr.aria-pressed]="settingsService.isShuffle()"
            (click)="toggleShuffle()"
          >
            <fa-icon [icon]="faShuffle" class="text-lg" />
          </button>

          <div class="flex items-center gap-1 sm:gap-3">
            <button
              type="button"
              class="w-12 h-12 rounded-full flex items-center justify-center touch-manipulation text-base-content/75 active:scale-[0.92] active:bg-base-content/8"
              aria-label="Previous track"
              (click)="previous()"
            >
              <fa-icon [icon]="faStepBackward" class="text-2xl" />
            </button>
            <button
              type="button"
              class="w-16 h-16 sm:w-[4.5rem] sm:h-[4.5rem] flex items-center justify-center rounded-full bg-base-content text-base-100 active:scale-95 transition-transform touch-manipulation"
              [class.bg-primary]="status() === playerStatus.Playing"
              [attr.aria-label]="
                status() === playerStatus.Playing ? 'Pause' : 'Play'
              "
              (click)="togglePlay()"
            >
              <fa-icon
                [icon]="status() === playerStatus.Playing ? faPause : faPlay"
                class="text-xl"
              />
            </button>
            <button
              type="button"
              class="w-12 h-12 rounded-full flex items-center justify-center touch-manipulation text-base-content/75 active:scale-[0.92] active:bg-base-content/8"
              aria-label="Next track"
              (click)="next()"
            >
              <fa-icon [icon]="faStepForward" class="text-2xl" />
            </button>
          </div>

          <button
            type="button"
            class="relative w-11 h-11 rounded-full flex items-center justify-center touch-manipulation text-base-content/40 active:scale-[0.92] active:bg-base-content/8 transition-colors"
            [class.text-primary]="settingsService.repeatMode() !== repeatModes.OFF"
            [attr.aria-label]="repeatLabel()"
            (click)="toggleRepeat()"
          >
            <fa-icon [icon]="faRepeat" class="text-lg" />
            @if (settingsService.repeatMode() === repeatModes.ONE) {
              <span
                class="absolute right-1.5 bottom-1.5 w-3.5 h-3.5 rounded-full bg-primary text-primary-content text-[8px] font-extrabold flex items-center justify-center pointer-events-none"
                aria-hidden="true"
                >1</span
              >
            }
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
