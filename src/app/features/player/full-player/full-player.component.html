<div
  class="fixed bottom-0 left-0 right-0 h-full z-50 bg-base-100 flex flex-col overflow-hidden rounded-t-[2.5rem] shadow-2xl"
  [class.anim-slide-in-up-spring]="isOpeningAnimation()"
  [class.anim-slide-out-down]="isClosingAnimation()"
  #playerRef
  appSwipeDown
  [handleSelector]="'.artwork-wrapper, .pressable-native'"
  (closePanel)="toggleSize(true)"
>
  <div class="w-full pt-4 pb-2 flex flex-col items-center justify-center shrink-0 relative z-20">
    <button 
      class="group w-full flex flex-col items-center justify-center -mt-2 pressable-native"
      (click)="toggleSize()"
    >
      <div class="w-12 h-1.5 bg-white/20 rounded-full group-active:bg-white/40 group-hover:bg-white/30 transition-colors"></div>
    </button>
  </div>

  <div class="absolute inset-0 -z-20 overflow-hidden bg-black">
    <img
      [ngSrc]="song().image || 'no_album_art.jpg'"
      alt="Song Art BG"
      class="absolute inset-0 w-full h-full object-cover blur-[100px] select-none pointer-events-none animate-bg-breathe"
      fill
      priority
      referrerpolicy="no-referrer"
      draggable="false"
    />
    <div class="absolute inset-0 bg-black/60"></div>
  </div>

  <div
    class="flex-1 flex flex-col items-center justify-start px-8 pb-10 pt-2 max-w-[600px] mx-auto relative z-10 w-full"
  >
    <div class="w-full flex-1 flex items-center justify-center artwork-container min-h-0">
      <div 
        class="relative w-full aspect-square max-w-[360px] group flex items-center justify-center artwork-wrapper"
        [class.playing]="status() === playerStatus.Playing"
      >
        <div class="absolute inset-0 rounded-2xl overflow-hidden ios-artwork-shadow">
          <img
            [ngSrc]="song().image || 'no_album_art.jpg'"
            [alt]="song().title"
            fill
            priority
            class="object-cover"
            referrerpolicy="no-referrer"
          />
        </div>
      </div>
    </div>

    <div class="w-full mt-6 space-y-8 shrink-0">
      <div class="flex items-center justify-between gap-4">
        <div class="flex-1 min-w-0">
          <app-moving-title
            [title]="song().title"
            [isBold]="true"
            fontSize="1.75rem"
            color="white"
          />
          <button 
            class="text-white/60 text-lg truncate mt-1 hover:text-white/80 transition-colors text-left w-full"
            (click)="navigateToArtist()"
          >
            {{ song().artist }}
          </button>
        </div>
        <app-favorite-button [song]="song()" />
      </div>

      <div class="space-y-4">
        <div class="ios-slider-container">
          <div class="slider-track">
            <div 
              class="slider-fill" 
              #timeProgress
            ></div>
          </div>
          <input
            #timeSlider
            type="range"
            min="0"
            [max]="duration() || 0"
            step="0.1"
            [value]="visualTime()"
            (input)="onTimeChange($event)"
            (touchstart)="onTimeDragStart()"
            (mousedown)="onTimeDragStart()"
            (touchend)="onTimeDragEnd($event)"
            (mouseup)="onTimeDragEnd($event)"
          />
        </div>
        <div class="flex justify-between text-xs font-medium text-white/40 tabular-nums">
          <span>{{ formatTime(visualTime()) }}</span>
          <span>{{ formatTime(duration()) }}</span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button
          class="p-4 transition-colors"
          [class.text-white]="isShuffle()"
          [class.text-white/40]="!isShuffle()"
          [class.hover:text-white]="!isShuffle()"
          (click)="toggleShuffle()"
        >
          <fa-icon [icon]="faShuffle" size="lg" />
        </button>

        <div class="flex items-center gap-6">
          <button
            class="p-4 text-white hover:text-primary transition-colors"
            (click)="previous()"
          >
            <fa-icon [icon]="faStepBackward" size="2xl" />
          </button>
          <button
            class="w-20 h-20 flex items-center justify-center bg-white text-black rounded-full hover:scale-105 active:scale-95 transition-transform shadow-xl"
            (click)="togglePlay()"
          >
            <fa-icon [icon]="status() === playerStatus.Playing ? faPause : faPlay" size="2xl" />
          </button>
          <button
            class="p-4 text-white hover:text-primary transition-colors"
            (click)="next()"
          >
            <fa-icon [icon]="faStepForward" size="2xl" />
          </button>
        </div>

        <button
          class="p-4 transition-colors"
          [class.text-white]="isRepeat()"
          [class.text-white/40]="!isRepeat()"
          [class.hover:text-white]="!isRepeat()"
          (click)="toggleRepeat()"
        >
          <fa-icon [icon]="faRepeat" size="lg" />
        </button>
      </div>
    </div>
  </div>
</div>
