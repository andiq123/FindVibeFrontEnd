<div
  class="fixed bottom-0 left-0 right-0 h-[100dvh] z-[150] flex flex-col"
  [class.anim-slide-up]="isOpeningAnimation()"
  [class.anim-slide-down]="isClosingAnimation()"
  #playerRef
  appSwipeDown
  [handleSelector]="'.player-content-card, .artwork-wrapper, .pressable-native'"
  (closePanel)="toggleSize(true)"
>
  <div class="player-content-card flex-1 flex flex-col rounded-t-[2.5rem] overflow-hidden relative shadow-2xl">
  <div class="w-full pt-4 pb-2 flex flex-col items-center justify-center shrink-0 relative z-20">
    <button 
      class="group w-full flex flex-col items-center justify-center -mt-2 pressable-native"
      (click)="toggleSize()"
    >
      <div class="w-12 h-1.5 bg-white/25 rounded-full group-active:bg-white/45 group-hover:bg-white/35 transition-colors"></div>
    </button>
  </div>
 
  <div class="absolute inset-0 -z-20 overflow-hidden bg-black">
    <img
      [ngSrc]="song().image || 'no_album_art.jpg'"
      alt="Song Art BG"
      class="absolute inset-0 w-full h-full object-cover select-none pointer-events-none opacity-50 blur-[60px]"
      fill
      sizes="100vw"
      priority
      referrerpolicy="no-referrer"
      draggable="false"
    />
    <div class="absolute inset-0 bg-black/40"></div>
  </div>

  <div
    class="flex-1 flex flex-col items-center justify-start px-6 pb-safe-bottom pt-2 max-w-[600px] mx-auto relative z-10 w-full min-h-0"
  >
    <div class="w-full flex-1 flex items-center justify-center artwork-container min-h-0 py-4">
      <div 
        class="relative w-full aspect-square max-w-[340px] group flex items-center justify-center artwork-wrapper"
        [class.playing]="status() === playerStatus.Playing && !isOpeningAnimation()"
      >
        <div class="absolute inset-0 rounded-2xl overflow-hidden ios-artwork-shadow">
          <img
            [ngSrc]="song().image || 'no_album_art.jpg'"
            [alt]="song().title"
            width="340"
            height="340"
            priority
            class="object-cover"
            referrerpolicy="no-referrer"
          />
        </div>
      </div>
    </div>

    <div class="w-full mt-4 space-y-6 shrink-0">
      <div class="flex items-center justify-between gap-4">
        <div class="flex-1 min-w-0">
          <app-moving-title
            [title]="song().title"
            [isBold]="true"
            fontSize="1.75rem"
            color="white"
          />
          <button 
            class="text-white/60 text-lg truncate mt-1 hover:text-white/80 transition-colors text-left w-full"
            (click)="navigateToArtist()"
          >
            {{ song().artist }}
          </button>
        </div>
        <app-favorite-button [song]="song()" />
      </div>

      <div class="space-y-4">
        <div class="ios-slider-container">
          <input
            #timeSlider
            type="range"
            min="0"
            [max]="duration() || 0"
            step="0.1"
            [value]="visualTime()"
            (input)="onTimeChange($event)"
            (touchstart)="onTimeDragStart()"
            (mousedown)="onTimeDragStart()"
            (touchend)="onTimeDragEnd($event)"
            (mouseup)="onTimeDragEnd($event)"
          />
          <div class="slider-track">
            <div 
              class="slider-fill" 
              [style.width.%]="progressPercent()"
            ></div>
          </div>
        </div>
        <div class="flex justify-between text-xs font-medium text-white/40 tabular-nums">
          <span>{{ visualTime() | timeFormat }}</span>
          <span>{{ duration() | timeFormat }}</span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button
          class="p-4 transition-all duration-300"
          [class.text-primary]="isShuffle()"
          [class.text-white/40]="!isShuffle()"
          [attr.aria-label]="isShuffle() ? 'Disable shuffle' : 'Enable shuffle'"
          [attr.aria-pressed]="isShuffle()"
          (click)="toggleShuffle()"
        >
          <fa-icon [icon]="faShuffle" size="lg" />
        </button>

        <div class="flex items-center gap-4">
          <button
            class="p-4 text-white hover:text-primary transition-colors"
            aria-label="Previous track"
            (click)="previous()"
          >
            <fa-icon [icon]="faStepBackward" size="2xl" />
          </button>
          <button
            class="w-16 h-16 flex items-center justify-center bg-white text-black rounded-full hover:scale-105 active:scale-95 transition-transform shadow-xl"
            [attr.aria-label]="status() === playerStatus.Playing ? 'Pause' : 'Play'"
            (click)="togglePlay()"
          >
            <fa-icon [icon]="status() === playerStatus.Playing ? faPause : faPlay" size="xl" />
          </button>
          <button
            class="p-4 text-white hover:text-primary transition-colors"
            aria-label="Next track"
            (click)="next()"
          >
            <fa-icon [icon]="faStepForward" size="2xl" />
          </button>
        </div>

        <button
          class="p-4 transition-all duration-300 relative"
          [class.text-primary]="repeatMode() !== repeatModes.OFF"
          [class.text-white/40]="repeatMode() === repeatModes.OFF"
          [attr.aria-label]="'Repeat mode: ' + repeatMode()"
          (click)="toggleRepeat()"
        >
          <fa-icon [icon]="faRepeat" size="lg" />
          @if (repeatMode() === repeatModes.ONE) {
            <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[8px] font-black text-primary-content bg-primary rounded-full w-3 h-3 flex items-center justify-center border border-base-100 shadow-sm mt-1 ml-1 scale-90">1</span>
          }
        </button>
      </div>
    </div>
  </div>
  </div>
</div>
