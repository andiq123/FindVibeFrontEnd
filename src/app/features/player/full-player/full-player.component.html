<div
  class="fixed bottom-0 left-0 right-0 h-[100dvh] flex flex-col"
  style="z-index: var(--z-full-player)"
  [class.anim-slide-up]="isOpeningAnimation()"
  [class.anim-slide-down]="isClosingAnimation()"
  #playerRef
  appSwipeDown
  [handleSelector]="'.player-content-card, .artwork-wrapper, .pressable-native'"
  (closePanel)="toggleSize(true)"
>
  <div
    class="player-content-card flex-1 flex flex-col rounded-t-[2.5rem] overflow-hidden relative shadow-2xl"
  >
    <div
      class="w-full pt-4 pb-2 flex flex-col items-center justify-center shrink-0 relative z-20"
    >
      <button
        class="group w-full flex flex-col items-center justify-center -mt-2 pressable-native touch-manipulation p-4 min-h-[44px]"
        (click)="toggleSize()"
        aria-label="Minimize player"
        type="button"
      >
        <div
          class="w-12 h-1.5 bg-base-content/30 rounded-full group-active:bg-base-content/50 transition-colors duration-200"
        ></div>
      </button>
    </div>

    <div class="absolute inset-0 -z-20 overflow-hidden bg-base-100">
      <img
        [ngSrc]="imageSrc()"
        alt="Song Art BG"
        class="absolute inset-0 w-full h-full object-cover select-none pointer-events-none opacity-50 blur-[60px]"
        fill
        sizes="100vw"
        priority
        referrerpolicy="no-referrer"
        draggable="false"
        (loadstart)="onImageLoadStart()"
        (load)="onImageLoad()"
        (error)="onImageError()"
      />
      <div class="absolute inset-0 bg-base-100/40"></div>
    </div>

    <div
      class="flex-1 flex flex-col items-center justify-start px-6 pb-safe-bottom pt-2 max-w-[600px] mx-auto relative z-10 w-full min-h-0"
    >
      <div
        class="w-full flex-1 flex items-center justify-center artwork-container min-h-0 py-2"
      >
        <div
          class="relative w-full aspect-square max-w-[340px] group flex items-center justify-center artwork-wrapper"
          [class.playing]="
            status() === playerStatus.Playing && !isOpeningAnimation()
          "
        >
          <div
            class="absolute inset-0 rounded-2xl overflow-hidden ios-artwork-shadow"
          >
            @if (isError()) {
              <div
                class="absolute inset-0 bg-error/20 flex items-center justify-center z-30"
              >
                <fa-icon
                  [icon]="faTriangleExclamation"
                  class="text-error text-5xl"
                />
              </div>
            }
            <img
              [ngSrc]="imageSrc()"
              [alt]="song().title"
              width="340"
              height="340"
              priority
              class="object-cover"
              referrerpolicy="no-referrer"
              (loadstart)="onImageLoadStart()"
              (load)="onImageLoad()"
              (error)="onImageError()"
            />
          </div>
        </div>
      </div>

      <div class="w-full mt-2 mb-10 space-y-2 shrink-0">
        <div class="flex items-center justify-between gap-4">
          <div class="flex-1 min-w-0">
            <app-moving-title
              [title]="song().title"
              [isBold]="true"
              fontSize="1.75rem"
              color="var(--color-base-content)"
            />
            <button
              class="text-base-content/60 text-lg truncate mt-1 active:text-base-content/90 transition-colors duration-150 text-left w-full touch-manipulation [@media(hover:hover)]:hover:text-base-content/80"
              (click)="navigateToArtist()"
              [attr.aria-label]="'View songs by ' + song().artist"
              type="button"
            >
              {{ song().artist }}
            </button>
          </div>
          <app-favorite-button [song]="song()" />
        </div>

        <div class="space-y-2">
          <div
            class="ios-slider-container relative w-full h-12 flex items-center touch-none select-none"
          >
            <input
              #timeSlider
              type="range"
              min="0"
              [max]="duration() || 0"
              step="0.1"
              [value]="visualTime()"
              (input)="onTimeChange($event)"
              (touchstart)="onTimeDragStart(); $event.stopPropagation()"
              (touchmove)="$event.stopPropagation()"
              (mousedown)="onTimeDragStart()"
              (touchend)="onTimeDragEnd($event); $event.stopPropagation()"
              (mouseup)="onTimeDragEnd($event)"
              (change)="onTimeDragEnd($event)"
              aria-label="Seek"
              role="slider"
              [attr.aria-valuemin]="0"
              [attr.aria-valuemax]="duration()"
              [attr.aria-valuenow]="visualTime()"
              [attr.aria-valuetext]="visualTime() + ' seconds'"
            />
            <div
              class="absolute w-full h-2 bg-base-content/30 rounded-full left-0 top-1/2 -translate-y-1/2 z-10 pointer-events-none overflow-visible"
            >
              <div
                class="relative h-full bg-accent rounded-full origin-left shadow-sm"
                [style.width.%]="progressPercent()"
              >
                <div
                  class="absolute right-0 top-1/2 translate-x-1/2 -translate-y-1/2 w-5 h-5 bg-base-content rounded-full shadow-lg ring-2 ring-base-100/10"
                ></div>
              </div>
            </div>
          </div>
          <div
            class="flex justify-between text-xs font-medium text-base-content/40 tabular-nums"
          >
            <span>{{ visualTime() | timeFormat }}</span>
            <span>{{ duration() | timeFormat }}</span>
          </div>
        </div>

        <div class="flex items-center justify-between pt-0">
          <button
            class="p-4 transition-all duration-200 touch-manipulation active:scale-95"
            [class.text-accent]="isShuffle()"
            [class.text-base-content/40]="!isShuffle()"
            [attr.aria-label]="
              isShuffle() ? 'Disable shuffle' : 'Enable shuffle'
            "
            [attr.aria-pressed]="isShuffle()"
            (click)="toggleShuffle()"
            type="button"
          >
            <fa-icon [icon]="faShuffle" size="lg" />
          </button>

          <div class="flex items-center gap-4">
            <button
              class="p-4 text-base-content active:text-accent/80 transition-colors duration-150 touch-manipulation active:scale-95 [@media(hover:hover)]:hover:text-accent"
              aria-label="Previous track"
              (click)="previous()"
              type="button"
            >
              <fa-icon [icon]="faStepBackward" size="2xl" />
            </button>
            <button
              class="w-16 h-16 flex items-center justify-center bg-base-content text-base-100 rounded-full active:scale-95 transition-transform duration-200 shadow-xl touch-manipulation [@media(hover:hover)]:hover:scale-105"
              [attr.aria-label]="
                status() === playerStatus.Playing ? 'Pause' : 'Play'
              "
              (click)="togglePlay()"
              type="button"
            >
              <fa-icon
                [icon]="status() === playerStatus.Playing ? faPause : faPlay"
                size="xl"
              />
            </button>
            <button
              class="p-4 text-base-content active:text-accent/80 transition-colors duration-150 touch-manipulation active:scale-95 [@media(hover:hover)]:hover:text-accent"
              aria-label="Next track"
              (click)="next()"
              type="button"
            >
              <fa-icon [icon]="faStepForward" size="2xl" />
            </button>
          </div>

          <button
            class="p-4 transition-all duration-200 relative touch-manipulation active:scale-95"
            [class.text-accent]="repeatMode() !== repeatModes.OFF"
            [class.text-base-content/40]="repeatMode() === repeatModes.OFF"
            [attr.aria-label]="'Repeat mode: ' + repeatMode()"
            (click)="toggleRepeat()"
            type="button"
          >
            <fa-icon [icon]="faRepeat" size="lg" />
            @if (repeatMode() === repeatModes.ONE) {
              <span
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[8px] font-black text-accent-content bg-accent rounded-full w-3 h-3 flex items-center justify-center border border-base-100 shadow-sm mt-1 ml-1 scale-90"
                >1</span
              >
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
