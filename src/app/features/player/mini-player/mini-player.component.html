<div
  class="bg-base-100/95 rounded-2xl fixed bottom-[92px] left-1/2 -translate-x-1/2 slideUp w-[calc(100%-1.5rem)] max-w-[480px] shadow-premium backdrop-blur-3xl border border-glass-border z-40 cursor-pointer overflow-hidden p-0.5"
  (click)="toggleSize()"
>
  <div class="flex items-center gap-4 w-full p-3">
    <!-- Album Art with Play Button -->
    <div class="relative w-14 aspect-square rounded-lg overflow-hidden ring-1 ring-base-200/30">
      <div class="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200">
        <app-player-button [status]="status()" />
      </div>
      <img
        class="w-full h-full object-cover"
        [src]="song().image || 'no_album_art.jpg'"
        alt="Album Art"
      />
    </div>

    <!-- Song Info -->
    <div class="flex-1 min-w-0">
      <app-moving-title
        [title]="song().title"
        [isActive]="status() === playerStatus.Playing"
        classes="text-sm font-medium block"
      />
      <app-moving-title
        [title]="song().artist"
        [isActive]="status() === playerStatus.Playing"
        classes="text-xs text-base-content/50 block"
      />
    </div>

    <!-- Expand Button -->
    <button class="btn btn-ghost btn-circle btn-sm text-base-content/50 hover:text-primary transition-colors duration-200">
      <fa-icon [icon]="faArrowUp" class="text-base" />
    </button>
  </div>
</div>
