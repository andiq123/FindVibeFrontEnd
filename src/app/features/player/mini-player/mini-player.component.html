<div
  class="mini-player-container glass-suggestions rounded-2xl fixed bottom-[92px] anim-mini-player-entry w-[calc(100%-1.5rem)] max-w-[600px] shadow-ios-md cursor-pointer overflow-hidden touch-manipulation"
  style="z-index: var(--z-mini-player); left: 50%; transform: translateX(-50%);"
  [class.border-primary/20]="isPlaying()"
  [class.border-transparent]="!isPlaying()"
  (click)="toggleSize()"
  (keydown.enter)="toggleSize()"
  tabindex="0"
  role="button"
>
  <div class="flex items-center gap-3 w-full p-3">
    <div class="flex items-center gap-2">
      <div
        class="album-art relative w-14 aspect-square rounded-lg overflow-hidden ring-1 ring-base-200/30"
        [class.album-art-playing]="isPlaying()"
      >
        @if (isLoading()) {
          <div
            class="absolute inset-0 bg-base-300/60 flex items-center justify-center z-30"
          >
            <div
              class="w-5 h-5 border-2 border-base-content/30 border-t-base-content rounded-full animate-spin"
            ></div>
          </div>
        }
        @if (isError()) {
          <div
            class="absolute inset-0 bg-error/20 flex items-center justify-center z-30"
          >
            <fa-icon
              [icon]="faTriangleExclamation"
              class="text-error text-xl"
            />
          </div>
        }
        @if (imageLoading()) {
          <div
            class="absolute inset-0 bg-base-content/5 flex items-center justify-center z-20"
          >
            <div
              class="w-4 h-4 border-2 border-base-content/20 border-t-base-content/60 rounded-full animate-spin"
            ></div>
          </div>
        }
        <div
          class="absolute inset-0 bg-base-100/10 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200 z-10"
        >
          <app-player-button [status]="status()" />
        </div>
        <img
          class="w-full h-full object-cover"
          [class.opacity-0]="imageLoading()"
          [class.opacity-100]="!imageLoading()"
          [ngSrc]="imageSrc()"
          width="56"
          height="56"
          priority
          alt="Album Art"
          referrerpolicy="no-referrer"
          (loadstart)="onImageLoadStart()"
          (load)="onImageLoad()"
          (error)="onImageError()"
        />
      </div>

      @if (isPlaying()) {
        <div
          class="waveform-indicator flex items-center gap-[3px] h-4 anim-fade-in"
        >
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
        </div>
      }
    </div>

    <div class="flex-1 min-w-0">
      <app-moving-title
        [title]="song().title"
        [isActive]="isPlaying()"
        [classes]="
          isPlaying()
            ? 'text-sm font-semibold block'
            : 'text-sm font-medium block'
        "
      />
      <app-moving-title
        [title]="song().artist"
        [isActive]="isPlaying()"
        classes="text-xs text-base-content/50 block"
      />
    </div>

    <button
      class="btn btn-ghost btn-circle btn-sm transition-colors duration-200"
      [class.text-primary]="isPlaying()"
      [class.text-base-content/50]="!isPlaying()"
    >
      <fa-icon [icon]="faArrowUp" class="text-base" />
    </button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="progress()"></div>
  </div>
</div>
