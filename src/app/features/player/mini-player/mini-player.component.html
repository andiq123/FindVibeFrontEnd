<div
  class="mini-player-container glass-suggestions rounded-2xl fixed anim-mini-player-entry w-[calc(100%-1.5rem)] max-w-[600px] shadow-ios-lg cursor-pointer overflow-hidden touch-manipulation border transition-all duration-300"
  style="z-index: var(--z-mini-player); left: 50%; transform: translateX(-50%); bottom: calc(max(2.5rem, env(safe-area-inset-bottom, 2.5rem)) + 4rem);"
  [class.border-primary/25]="status() === playerStatus.Playing"
  [class.border-base-content/8]="status() !== playerStatus.Playing"
  [class.shadow-primary/15]="status() === playerStatus.Playing"
  (click)="toggleSize()"
  (keydown.enter)="toggleSize()"
  tabindex="0"
  role="button"
>
  <div class="flex items-center gap-3 w-full p-3">
    <div class="flex items-center gap-2">
      <div
        class="album-art relative w-16 aspect-square rounded-xl overflow-hidden ring-1 ring-base-content/10 shadow-md transition-all duration-300"
        [class.album-art-playing]="status() === playerStatus.Playing"
        [class.ring-primary/25]="status() === playerStatus.Playing"
        [class.shadow-primary/25]="status() === playerStatus.Playing"
      >
        @if (status() === playerStatus.Loading) {
          <div
            class="absolute inset-0 bg-base-300/60 flex items-center justify-center z-30"
          >
            <div
              class="w-5 h-5 border-2 border-base-content/30 border-t-base-content rounded-full animate-spin"
            ></div>
          </div>
        }
        @if (status() === playerStatus.Error) {
          <div
            class="absolute inset-0 bg-error/20 flex items-center justify-center z-30"
          >
            <fa-icon
              [icon]="faTriangleExclamation"
              class="text-error text-xl"
            />
          </div>
        }
        <div
          class="absolute inset-0 bg-base-100/10 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200 z-10"
        >
          <app-player-button [status]="status()" />
        </div>
        <img
          class="w-full h-full object-cover"
          [ngSrc]="song().image || 'no_album_art.jpg'"
          width="56"
          height="56"
          priority
          alt="Album Art"
          referrerpolicy="no-referrer"
        />
      </div>
      @if (status() === playerStatus.Playing) {
        <div
          class="waveform-indicator flex items-center gap-[3px] h-4 anim-fade-in"
        >
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
        </div>
      }
    </div>
    <div class="flex-1 min-w-0">
      <app-moving-title
        [title]="song().title"
        [isActive]="status() === playerStatus.Playing"
        [classes]="
          status() === playerStatus.Playing
            ? 'text-sm font-semibold block'
            : 'text-sm font-medium block'
        "
      />
      <app-moving-title
        [title]="song().artist"
        [isActive]="status() === playerStatus.Playing"
        classes="text-xs text-base-content/50 block"
      />
    </div>
    <button
      class="btn btn-ghost btn-circle btn-sm transition-colors duration-200"
      [class.text-primary]="status() === playerStatus.Playing"
      [class.text-base-content/45]="status() !== playerStatus.Playing"
    >
      <fa-icon [icon]="faArrowUp" class="text-base" />
    </button>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="progress()"></div>
  </div>
</div>
