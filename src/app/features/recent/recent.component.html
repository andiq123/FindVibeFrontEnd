<app-page-layout>
  <div class="flex items-end justify-between gap-3 mb-4">
    <h1
      class="font-bold text-2xl tracking-tight bg-gradient-to-br from-base-content via-base-content/95 to-primary/80 bg-clip-text text-transparent"
    >
      Recent
    </h1>
    @if (songs().length) {
      <div class="flex items-center gap-1.5 shrink-0">
        <button
          type="button"
          class="h-8 px-2.5 rounded-lg bg-primary/15 text-primary text-xs font-semibold active:scale-[0.97]"
          (click)="playAll()"
        >
          Play all
        </button>
        <button
          type="button"
          class="h-8 px-2.5 rounded-lg text-base-content/45 text-xs font-semibold active:text-error active:bg-error/10"
          (click)="clearHistory()"
        >
          Clear
        </button>
      </div>
    }
  </div>
  <div class="relative pb-24">
    <div class="premium-card min-h-[400px]">
      <app-song-list
        [songs]="songs()"
        emptyStateTitle="No vibes yet"
        emptyStateDescription="When you listen to songs, your last 50 will show up here"
        (playlistChange)="onChangePlaylist()"
      />
    </div>
  </div>
</app-page-layout>
