<div 
  class="w-full max-w-2xl mx-auto mt-0 pb-48 slideRight space-y-6 overflow-y-auto"
  appPullToRefresh
  (refresh)="handleRefresh()"
>
  <h1 class="font-bold text-3xl tracking-tight px-5 pt-4">History</h1>

  <div class="mx-5 bg-white/[0.03] rounded-[2.5rem] overflow-hidden border border-white/[0.05]">
    <ul class="flex flex-col">
      @for (song of songs(); track song.link) { 
          <li class="group/item list-none">
            <app-song
              [song]="song"
              (playlistChange)="onChangePlaylist()"
            />
          </li> 
      } @empty {
        <li class="flex flex-col items-center justify-center py-12 px-8 text-center">
          <div class="w-16 h-16 rounded-full bg-base-200/50 flex items-center justify-center mb-4">
            <span class="text-2xl">⏳</span>
          </div>
          <p class="text-base-content/70">No vibes yet</p>
          <p class="text-base-content/50 text-sm mt-2">When you listen to songs, your last 20 will show up here</p>
        </li>
      }
    </ul>
  </div>
</div>
