<app-page-layout [showStickyHeader]="true">
  <div header class="w-full">
    <h1 class="font-bold text-4xl section-headline">History</h1>
  </div>

  <div class="relative pt-6 pb-24">
    <div class="premium-card min-h-[400px]">
    <app-song-list
      [songs]="songs()"
      emptyStateTitle="No vibes yet"
      emptyStateDescription="When you listen to songs, your last 20 will show up here"
      (playlistChange)="onChangePlaylist()"
    />
    </div>
  </div>
</app-page-layout>
