<app-page-layout>
  <h1 class="font-bold text-4xl tracking-tighter bg-gradient-to-b from-base-content via-base-content/90 to-primary/70 bg-clip-text text-transparent mb-6">History</h1>
  <div class="relative pb-24">
    <div class="premium-card min-h-[400px]">
    <app-song-list
      [songs]="songs()"
      emptyStateTitle="No vibes yet"
      emptyStateDescription="When you listen to songs, your last 20 will show up here"
      (playlistChange)="onChangePlaylist()"
    />
    </div>
  </div>
</app-page-layout>
