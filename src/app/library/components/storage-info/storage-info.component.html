<button class="btn" (click)="hidden.set(!hidden())">
  <fa-icon [icon]="faDownload" size="lg" />
</button>
@if(hidden()){
<div
  class="flex flex-col gap-3 absolute z-10 bg-base-200 p-5 w-full inset-0 h-fit rounded-lg slideDown shadow-2xl"
>
  <div class="flex justify-between items-center">
    <p class="text-xl font-bold">Storage info</p>
    <button class="btn" (click)="hidden.set(!hidden())">
      <fa-icon [icon]="faX" size="lg" />
    </button>
  </div>
  <div class="flex items-center gap-3 justify-between">
    <div class="flex gap-3">
      <button
        class="btn bg-base-300"
        (click)="downloadAll()"
        [disabled]="loadingDownloading()"
      >
        <fa-icon [icon]="faCloudArrowDown" size="lg" />
        @if(loadingDownloading()){
        <span class="loading loading-spinner loading-md"></span>
        }
      </button>
      @if(showRemoveCacheButton()){
      <button class="btn" (click)="removeCache()">
        <fa-icon [icon]="faTrash" />
      </button>
      }
    </div>
    <div class="flex flex-col gap-3 items-center">
      <progress
        class="progress progress-primary w-20"
        [value]="storageUsed()"
        [max]="storageTotal()"
      ></progress>
      <p class="font-bold text-xs">
        {{ storageUsed() }} GB / {{ storageTotal() }} GB
      </p>
    </div>
  </div>
</div>
}
