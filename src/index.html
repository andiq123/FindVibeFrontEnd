<!doctype html>
<html lang="en" data-theme="vibenative">
  <head>
    <meta charset="utf-8" />
    <title>FindVibe</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="FindVibe - Discover and play your favorite music with an iOS-native experience"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Apple Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="icons/icon-192x192.png"
    />

    <!-- DNS Prefetch and Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <link
      rel="preconnect"
      href="https://lh3.googleusercontent.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://jpg.muzvibe.org" />
    <link rel="preconnect" href="https://jpg.muzvibe.org" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
